<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系统安全提示</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #0f0; font-family: monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #matrix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .warning-box { background: rgba(0, 0, 0, 0.8); border: 2px solid red; padding: 20px; border-radius: 10px; text-align: center; max-width: 80%; z-index: 10; box-shadow: 0 0 20px red; }
        h1 { color: red; font-size: 24px; margin-top: 0; animation: blink 1s infinite; }
        p { font-size: 16px; line-height: 1.5; color: #fff; }
        .ip-address { color: #ff0; font-weight: bold; font-size: 18px; }
        button { margin-top: 20px; padding: 12px 24px; background: red; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:active { background: darkred; }
        #jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="warning-box" id="warnBox">
        <h1>⚠️ 警告 ⚠️</h1>
        <p>系统检测到未经授权的访问。</p>
        <p>您的设备 IP 已被锁定：</p>
        <p class="ip-address" id="userIp">正在获取...</p>
        <p>请立即点击下方按钮解除限制，否则系统将自动销毁您的手机相册！</p>
        <button onclick="revealJoke()">立即解除锁定</button>
    </div>

    <div id="jumpscare">
        <h1 style="color: #333; font-size: 28px; animation: none;">大聪明，你被骗了！</h1>
        <p style="color: #666;">哪有什么锁定，就是想逗逗你~ 周末愉快！</p>
        <div style="font-size: 80px; margin-top: 20px;">😂</div>
    </div>

    <script>
        // 1. 获取公网 IP
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('userIp').innerText = data.ip;
            })
            .catch(() => {
                document.getElementById('userIp').innerText = "获取失败，算你走运";
            });

        // 2. 黑客帝国代码雨特效
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 3. 点击按钮后的翻转
        function revealJoke() {
            // 手机震动一下（如果微信支持）
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            
            document.getElementById('warnBox').style.display = 'none';
            document.getElementById('jumpscare').style.display = 'flex';
            document.getElementById('jumpscare').style.background = '#ffeb3b'; // 变成亮黄色
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Error</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #matrix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .warning-box { background: rgba(0, 0, 0, 0.9); border: 2px solid red; padding: 20px; border-radius: 10px; text-align: center; max-width: 80%; z-index: 10; box-shadow: 0 0 20px red; }
        h1 { color: red; font-size: 24px; margin-top: 0; }
        .ip-address { color: #ff0; font-size: 18px; font-weight: bold; }
        button { margin-top: 20px; padding: 12px 24px; background: red; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        #jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffeb3b; z-index: 999; justify-content: center; align-items: center; flex-direction: column; color: #333; text-align: center; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="warning-box" id="warnBox">
        <h1>⚠️ 警告 ⚠️</h1>
        <p>您的设备 IP 已被锁定：</p>
        <p class="ip-address" id="userIp">正在获取...</p>
        <button onclick="revealJoke()">点击这里解除锁定</button>
    </div>

    <div id="jumpscare">
        <h1 style="color: #333;">大聪明，你被骗了！</h1>
        <p style="font-size: 16px;">看把你吓的，这只是一个网页特效。</p>
        <div style="font-size: 80px; margin-top: 20px;">😂</div>
    </div>

    <script>
        // 获取 IP
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { document.getElementById('userIp').innerText = data.ip; })
            .catch(() => { document.getElementById('userIp').innerText = "获取失败"; });

        // 黑客代码雨
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 触发全屏和恶作剧
        function revealJoke() {
            // 请求全屏（隐藏微信顶部栏）
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            document.getElementById('warnBox').style.display = 'none';
            document.getElementById('jumpscare').style.display = 'flex';
        }
    </script>
</body>
</html>

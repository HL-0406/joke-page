<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系统警告</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        /* 让页面抖动 */
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        .shaking { animation: shake 0.5s; animation-iteration-count: infinite; }
        
        .warning-box { background: rgba(0, 0, 0, 0.9); border: 2px solid red; padding: 30px 20px; border-radius: 10px; text-align: center; max-width: 80%; box-shadow: 0 0 30px red; z-index: 10; }
        h1 { color: red; font-size: 28px; margin-top: 0; }
        .ip-address { color: #ff0; font-size: 20px; font-weight: bold; margin: 15px 0; }
        button { margin-top: 20px; padding: 15px 30px; background: red; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px red; }
        
        /* 隐藏的最终彩蛋 */
        #jumpscare { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 999; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #jumpscare h1 { color: #0f0; font-family: monospace; font-size: 22px; }
    </style>
</head>
<body>

    <div class="warning-box" id="warnBox">
        <h1>⚠️ 致命错误 ⚠️</h1>
        <p>系统检测到未经授权的访问。</p>
        <p>您的设备 IP 已被锁定：</p>
        <p class="ip-address" id="userIp">正在获取...</p>
        <p>请立即点击下方按钮解除限制，否则系统将自动销毁您的手机相册！</p>
        <button onclick="startNightmare()">立即解除锁定</button>
    </div>

    <div id="jumpscare">
        <h1>哈哈哈，别点啦！</h1>
        <p style="color:#fff; padding: 0 20px;">这其实是个网页，你越点它就越激动。</p>
        <p style="color:#888; font-size: 12px; margin-top: 30px;">（关掉网页就没事了，宝宝我喜欢你！）</p>
    </div>

    <script>
        // 1. 获取公网 IP
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => { document.getElementById('userIp').innerText = data.ip; })
            .catch(() => { document.getElementById('userIp').innerText = "无法获取"; });

        // 2. 核心恶作剧逻辑
        function startNightmare() {
            // 手机疯狂震动（有的手机微信不支持，能震血赚）
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 500]);
            }
            
            // 让整个页面开始抖动
            document.body.classList.add('shaking');
            
            // 把警告框变大，贴近屏幕边缘，让他感觉退不出去
            document.getElementById('warnBox').style.transform = "scale(1.1)";
            document.getElementById('warnBox').style.transition = "all 0.1s";
            
            // 改掉按钮的文字
            document.querySelector('button').innerText = "别点啦！没用的！";
            
            // 连续点3次，才给他看最后的真相
            let clickCount = 0;
            document.querySelector('button').onclick = function() {
                clickCount++;
                if (navigator.vibrate) navigator.vibrate([200]); // 点一次震一次
                if (clickCount >= 3) {
                    document.getElementById('warnBox').style.display = 'none';
                    document.body.classList.remove('shaking');
                    document.getElementById('jumpscare').style.display = 'flex';
                }
            };
        }
    </script>
</body>
</html>
